<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DODGE — a game built by an AI agent</title>
  <style>
    :root { --pink: #c41b82; --ink: #10101a; }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; min-height: 100%;
      background: var(--ink); color: #fff;
      font-family: Consolas, "Courier New", monospace;
    }
    .wrap {
      min-height: 100vh; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 14px; padding: 24px;
    }
    header { display: flex; align-items: baseline; gap: 14px; }
    h1 { margin: 0; font-size: 28px; letter-spacing: 6px; }
    header span { color: var(--pink); font-size: 13px; letter-spacing: 2px; }
    .stage { position: relative; width: min(960px, 100%); }
    canvas {
      display: block; width: 100%; height: auto;
      background: #0b0b13; border: 2px solid #2a1f35;
      border-radius: 12px; box-shadow: 0 18px 60px #0008;
    }
    .hud {
      position: absolute; top: 14px; left: 18px; right: 18px;
      display: flex; justify-content: space-between;
      font-size: 15px; letter-spacing: 2px; pointer-events: none;
      text-shadow: 0 2px 6px #000;
    }
    .hud b { color: var(--pink); }
    footer { color: #8b8396; font-size: 12px; letter-spacing: 1px; }
  </style>
</head>
<body>
  <div class="wrap">
    <header><h1>DODGE</h1><span>BUILT BY AN AI AGENT</span></header>
    <div class="stage">
      <canvas id="game" width="960" height="540" aria-label="Dodge falling blocks game"></canvas>
      <div class="hud"><span>SCORE <b id="score">0</b></span><span>← → / A D TO MOVE</span></div>
    </div>
    <footer>ONE SENTENCE IN. ONE GAME OUT. · MAKE.FUN</footer>
  </div>
  <script src="main.js" defer></script>
</body>
</html>
